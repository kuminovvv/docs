name: docs-check
on:
  push:
    paths:
      - 'CLAUDE.md'
      - 'REVIEW.md'
      - 'README.md'
      - 'docs/**'
      - 'scripts/verify_docs.py'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'agents.md'
      - 'CLAUDE.md'
      - 'REVIEW.md'
      - 'README.md'
      - 'docs/**'
      - 'scripts/verify_docs.py'
      - '.github/workflows/docs-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation links and required files
        run: python3 scripts/verify_docs.py
